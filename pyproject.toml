[project]
name = "pixbin"
version = "0.1.0"
description = "Python client library for Pixbin Image API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Deni Bertovic"}
]
keywords = ["pixbin", "images", "api", "transformation", "thumbnail", "resize"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
full = ["Pillow>=9.0.0"]
dev = ["pytest>=7.0", "responses>=0.23", "ruff>=0.16"]

# `uv sync` installs the dev group by default but never installs extras on
# its own, so the group points back at the extras to keep one list of tools.
[dependency-groups]
dev = ["pixbin[dev,full]"]

[project.urls]
Documentation = "https://pixbin.net/docs"
Source = "https://github.com/denibertovic/pixbin-python"
Tracker = "https://github.com/denibertovic/pixbin-python/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixbin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"
# Code blocks in the README are illustrative, not a formatting target.
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "G",      # flake8-logging-format
    "DTZ",    # flake8-datetimez
    "BLE",    # flake8-blind-except
    "EXE",    # flake8-executable
]
ignore = [
    "BLE001",  # Blind except is intentional for the JSON and PIL fallbacks
]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["F401"]  # Fixtures may appear unused

[tool.ruff.lint.isort]
known-first-party = ["pixbin"]
