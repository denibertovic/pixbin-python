name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  checks:
    uses: ./.github/workflows/pr-checks.yaml

  build:
    name: Build distribution
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv version --short)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v${tag_version} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixbin/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC), no API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
